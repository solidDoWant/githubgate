# Generated by scripts/ci/tekton-generate.sh from scripts/ci/tekton-pipelinerun.yaml.tmpl. Do not edit.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # A fixed name collides with the previous run, which Pipelines-as-Code keeps.
  generateName: githubgate-pull-request-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "master"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  timeouts:
    pipeline: 1h
  workspaces:
    # Shared by the step and dockerd at the same path, so stage containers
    # can mount the checkout.
    - name: source
      emptyDir: {}
    - name: guard
      emptyDir: {}
  taskRunSpecs:
    - pipelineTaskName: test-guard
      serviceAccountName: ci-report
    - pipelineTaskName: report
      serviceAccountName: ci-report
    # Every stage runs inside the dind sidecar's cgroup, so its memory is the
    # memory of all stages together. The size is max(8 GiB, 1.5 times the
    # measured peak of used memory, page cache excluded; the final stage table
    # prints it). No CPU limit: a kata VM's CPU request only places the pod and
    # sets its share.
    - pipelineTaskName: ci
      sidecarSpecs:
        - name: dind
          computeResources:
            requests:
              cpu: "8"
              memory: 8Gi
            limits:
              memory: 8Gi
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: guard
    tasks:
      - name: ci
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: docker
            - name: namespace
              value: ci-tekton
        params:
          - name: script
            value: |
              set -eu
              mkdir src
              cd src
              git init -q .
              git remote add origin "$(params.repo_url)"
              # The full history: the change rules need the merge base with
              # master, and `make test` runs the test guard's tests over it.
              git fetch -q origin '+refs/heads/master:refs/remotes/origin/master' "$(params.revision)"
              git checkout -q --detach "$(params.revision)"
              # Test the PR merged with master, as actions/checkout does.
              if ! git -c user.email=ci@ci -c user.name=ci merge -q --no-ff --no-edit origin/master; then
                echo "the pull request conflicts with master; rebase it:" >&2
                git diff --name-only --diff-filter=U >&2
                exit 1
              fi
              exec ./scripts/ci/stages.sh pull_request
        workspaces:
          - name: source
            workspace: source
      - name: test-guard
        workspaces:
          - name: guard
            workspace: guard
        taskSpec:
          workspaces:
            - name: guard
              mountPath: /workspace/guard
          volumes:
            # githubgate's client, a static binary.
            - name: githubgate-client
              image:
                # renovate: image
                reference: ghcr.io/soliddowant/githubgate-client:0.3.1@sha256:0674f582a9fd5ecefe1d36811f415e5b9b9184b0b8923294a85fb6239504b468
                pullPolicy: IfNotPresent
            # The ServiceAccount token githubgate checks.
            - name: githubgate-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: githubgate
                      expirationSeconds: 600
                      path: token
            # githubgate's certificate chains to the cluster root CA, which
            # Kyverno copies into every namespace.
            - name: githubgate-ca
              configMap:
                name: root-ca-pub-cert
          steps:
            # Reads the labels when the run starts, so a /retest after the
            # owner adds test-removal-approved picks it up. The only step with
            # a GitHub token: it runs this script and nothing from the
            # repository.
            - name: labels
              image: mirror.gcr.io/library/python:3.14.9@sha256:30a34d141e34b8fbedabecb8f86b3d49a62e348d8112ad3c1289f0b2b216ad3e
              computeResources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              env:
                - name: GITHUBGATE_URL
                  value: https://githubgate.ci.svc:8443
                - name: GITHUBGATE_CA_FILE
                  value: /etc/githubgate-ca/ca.crt
              volumeMounts:
                - name: githubgate-client
                  mountPath: /opt/githubgate
                - name: githubgate-token
                  mountPath: /var/run/secrets/githubgate
                - name: githubgate-ca
                  mountPath: /etc/githubgate-ca
              script: |
                #!/usr/bin/env python3
                import json, subprocess, urllib.request
                def github_token(*permissions):
                    # A short-lived installation token from githubgate, for this
                    # task's ServiceAccount (ci/project chart's policies). Kept in
                    # memory only.
                    args = ["/opt/githubgate/githubgate-client", "token", "--owner", "{{ repo_owner }}", "--repo", "{{ repo_name }}"]
                    for permission in permissions:
                        args += ["--permission", permission]
                    return subprocess.run(args, check=True, capture_output=True, text=True).stdout.strip()
                request = urllib.request.Request(
                    "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/issues/{{ pull_request_number }}/labels?per_page=100",
                    headers={"Authorization": "Bearer " + github_token("pull_requests=read", "issues=read"), "Accept": "application/vnd.github+json"},
                )
                with urllib.request.urlopen(request, timeout=30) as response:
                    labels = [label["name"] for label in json.load(response)]
                with open("/workspace/guard/labels", "w") as out:
                    out.write(",".join(labels))
                print("labels:", ",".join(labels))
            # No token from here on.
            - name: guard
              image: mirror.gcr.io/library/python:3.14.9@sha256:30a34d141e34b8fbedabecb8f86b3d49a62e348d8112ad3c1289f0b2b216ad3e
              computeResources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              script: |
                #!/bin/sh
                set -eu
                mkdir /workspace/guard/src
                cd /workspace/guard/src
                git init -q .
                git remote add origin "$(params.repo_url)"
                git fetch -q origin '+refs/heads/master:refs/remotes/origin/master' "$(params.revision)"
                git checkout -q --detach "$(params.revision)"
                TEST_GUARD_PR_LABELS=$(cat /workspace/guard/labels) make test-guard
    finally:
      # Fails the run when a stage failed or ci left no result: ci itself
      # exits 0 after its stages ran, because a finally task cannot rely on
      # the results of a failed task. Gives every stage its own check run, so
      # the failing stage and its failure report show on the commit. Runs
      # only this script with a GitHub token (from githubgate, as ci-report),
      # never code from the repository.
      - name: report
        params:
          - name: stages
            value: $(tasks.ci.results.output)
        taskSpec:
          params:
            - name: stages
              type: string
          volumes:
            # githubgate's client, a static binary.
            - name: githubgate-client
              image:
                # renovate: image
                reference: ghcr.io/soliddowant/githubgate-client:0.3.1@sha256:0674f582a9fd5ecefe1d36811f415e5b9b9184b0b8923294a85fb6239504b468
                pullPolicy: IfNotPresent
            # The ServiceAccount token githubgate checks.
            - name: githubgate-token
              projected:
                sources:
                  - serviceAccountToken:
                      audience: githubgate
                      expirationSeconds: 600
                      path: token
            # githubgate's certificate chains to the cluster root CA, which
            # Kyverno copies into every namespace.
            - name: githubgate-ca
              configMap:
                name: root-ca-pub-cert
          steps:
            - name: report
              image: mirror.gcr.io/library/python:3.14.9@sha256:30a34d141e34b8fbedabecb8f86b3d49a62e348d8112ad3c1289f0b2b216ad3e
              computeResources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 256Mi
              env:
                - name: GITHUBGATE_URL
                  value: https://githubgate.ci.svc:8443
                - name: GITHUBGATE_CA_FILE
                  value: /etc/githubgate-ca/ca.crt
                # Through the environment, not the script text, so the
                # result's content is never parsed as code.
                - name: STAGES
                  value: $(params.stages)
                - name: DETAILS_URL
                  value: https://tekton.echozulu.games/#/namespaces/$(context.pipelineRun.namespace)/pipelineruns/$(context.pipelineRun.name)
              volumeMounts:
                - name: githubgate-client
                  mountPath: /opt/githubgate
                - name: githubgate-token
                  mountPath: /var/run/secrets/githubgate
                - name: githubgate-ca
                  mountPath: /etc/githubgate-ca
              script: |
                #!/usr/bin/env python3
                import datetime, json, os, subprocess, sys, urllib.request
                def github_token(*permissions):
                    # A short-lived installation token from githubgate, for this
                    # task's ServiceAccount (ci/project chart's policies). Kept in
                    # memory only.
                    args = ["/opt/githubgate/githubgate-client", "token", "--owner", "{{ repo_owner }}", "--repo", "{{ repo_name }}"]
                    for permission in permissions:
                        args += ["--permission", permission]
                    return subprocess.run(args, check=True, capture_output=True, text=True).stdout.strip()

                try:
                    stages = json.loads(os.environ.get("STAGES", ""))
                except ValueError:
                    print("ci left no stages result: it did not finish", file=sys.stderr)
                    sys.exit(1)
                def iso(seconds):
                    return datetime.datetime.fromtimestamp(seconds, datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
                try:
                    token = github_token("checks=write")
                except subprocess.CalledProcessError as error:
                    # No check runs, but the stages' results still decide the run.
                    print(f"no GitHub token from githubgate: {error.stderr.strip()}", file=sys.stderr)
                    token = None
                failed = []
                for stage in stages:
                    passed = stage["result"] == "passed"
                    if not passed:
                        failed.append(stage["name"])
                    title = f"{stage['name']} {stage['result']} in {stage['seconds']}s"
                    print(title)
                    body = {
                        "name": "stage: " + stage["name"],
                        "head_sha": "{{ revision }}",
                        "status": "completed",
                        "conclusion": "success" if passed else "failure",
                        "started_at": iso(stage["started"]),
                        "completed_at": iso(stage["ended"]),
                        "details_url": os.environ["DETAILS_URL"],
                        "output": {"title": title, "summary": title, "text": stage.get("report", "")},
                    }
                    if token is None:
                        continue
                    request = urllib.request.Request(
                        "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/check-runs",
                        data=json.dumps(body).encode(),
                        method="POST",
                        headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"},
                    )
                    # A check run GitHub does not accept is reported, not
                    # fatal: only a failed stage fails the run.
                    try:
                        urllib.request.urlopen(request, timeout=30).close()
                    except Exception as error:
                        print(f"check run for {stage['name']} not created: {error}", file=sys.stderr)
                if failed:
                    print("failed stages: " + ", ".join(failed), file=sys.stderr)
                    sys.exit(1)
