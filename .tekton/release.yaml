# Generated by scripts/ci/tekton-generate.sh from scripts/ci/tekton-release.yaml.tmpl. Do not edit.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # A fixed name collides with the previous run, which Pipelines-as-Code keeps.
  generateName: githubgate-release-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "push" && target_branch.matches("^refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+(-rc\\.[0-9]+)?$")
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: ref
      value: "{{ target_branch }}"
  timeouts:
    pipeline: 1h
  taskRunTemplate:
    serviceAccountName: ci-release
  workspaces:
    # Shared by the step and dockerd at the same path, so the stage container
    # can mount the checkout. Only one task uses it, and it must stay an
    # emptyDir: a claim makes Tekton start an affinity-assistant pod, which the
    # cluster refuses to run as ci-release.
    - name: source
      emptyDir: {}
  taskRunSpecs:
    # The stage runs inside the dind sidecar's cgroup: it cross-compiles four
    # binaries, scans them and assembles two images for two platforms. No CPU
    # limit: a kata VM's CPU request only places the pod and sets its share.
    - pipelineTaskName: publish
      sidecarSpecs:
        - name: dind
          computeResources:
            requests:
              cpu: "8"
              memory: 6Gi
            limits:
              memory: 6Gi
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
      - name: ref
        type: string
    workspaces:
      - name: source
    tasks:
      - name: publish
        taskRef:
          resolver: cluster
          params:
            - name: kind
              value: task
            - name: name
              value: docker
            - name: namespace
              value: ci-tekton
        params:
          - name: script
            value: |
              set -eu
              # The trigger only matches version tags, so the ref is
              # refs/tags/v<version>; publish-release.sh checks it again.
              ref='$(params.ref)'
              version="${ref##*/}"
              mkdir src
              cd src
              git init -q .
              git remote add origin "$(params.repo_url)"
              git fetch -q --depth 1 origin "$(params.revision)"
              git checkout -q --detach "$(params.revision)"
              RELEASE_VERSION="${version#v}"
              export RELEASE_VERSION
              export GITHUBGATE_REPO="{{ repo_owner }}/{{ repo_name }}"
              exec ./scripts/ci/stages.sh release
        workspaces:
          - name: source
            workspace: source
