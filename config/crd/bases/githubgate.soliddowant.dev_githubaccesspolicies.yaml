                  - message: a rule with installationRef needs repositories and permissions
                    rule: has(self.userAuthorizationRef) || (has(self.repositories)
                      && has(self.permissions))
                  - message: 'a user rule has no repositories or permissions: its
                      user authorization''s operations replace them'
                    rule: '!has(self.userAuthorizationRef) || (!has(self.repositories)
                      && !has(self.permissions))'
                  - message: 'a user rule needs token mode off and proxy mode on:
                      a user access token is never handed out'
                    rule: '!has(self.userAuthorizationRef) || ((!has(self.token) ||
                      !self.token.enabled) && has(self.proxy) && self.proxy.enabled)'
                  - message: a user rule needs proxy.allowOperations, with exact operation
                      ids and no globs
                    rule: '!has(self.userAuthorizationRef) || !has(self.proxy) ||
                      (has(self.proxy.allowOperations) && self.proxy.allowOperations.all(o,
