                      || has(self.proxy.denyOperations) || has(self.proxy.allowMutations)
                      || has(self.proxy.denyMutations))'
                  - message: 'proxy.publicRead needs at least one repository named
                      without a pattern: the public-read token is limited to those
                      repositories'
                    rule: '!has(self.proxy) || !has(self.proxy.publicRead) || !self.proxy.publicRead
                      || !has(self.repositories) || self.repositories.exists(r, !r.contains(''*''))'
