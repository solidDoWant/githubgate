                      || has(self.proxy.denyMutations) || has(self.proxy.pushRefs)
                      || has(self.proxy.publicRead) || has(self.proxy.webPaths))'
                  - message: at least one mode must be enabled
                    rule: (has(self.token) && self.token.enabled) || (has(self.proxy)
                      && self.proxy.enabled)
                  - message: 'proxy.pushRefs and the proxy operation and mutation
