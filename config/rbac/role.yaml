---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - githubgate.soliddowant.dev
  resources:
  - githubaccesspolicies
  - githubapps
  - githubinstallations
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - githubgate.soliddowant.dev
  resources:
  - githubaccesspolicies/status
  - githubapps/status
  - githubinstallations/status
  verbs:
  - get
  - patch
  - update
