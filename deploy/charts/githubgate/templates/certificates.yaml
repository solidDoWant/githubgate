{{- $fullname := include "githubgate.fullname" . }}
{{- $serviceNames := list (printf "%s.%s.svc" $fullname .Release.Namespace) (printf "%s.%s.svc.cluster.local" $fullname .Release.Namespace) }}
{{- if .Values.certManager.enabled }}
{{- $tlsManaged := not .Values.tls.existingSecret }}
{{- $webhookManaged := and (include "githubgate.webhookServer" .) (include "githubgate.webhookCertManaged" .) }}
{{- if or $tlsManaged $webhookManaged }}
{{- /* cert-manager makes the CA and keeps its key in the Secret <fullname>-ca, so
no key or certificate is in the rendered manifests or Helm's release record.
The name constraints limit the CA to the Service names it signs. */}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}-selfsigned
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-ca
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ $fullname }}-ca
  secretName: {{ $fullname }}-ca
  duration: {{ .Values.certificate.caDuration }}
  privateKey:
    algorithm: ECDSA
    size: 256
  nameConstraints:
    critical: true
    permitted:
      dnsDomains:
        {{- toYaml $serviceNames | nindent 8 }}
  issuerRef:
    name: {{ $fullname }}-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ $fullname }}-ca
{{- end }}
{{- if $tlsManaged }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  secretName: {{ $fullname }}-tls
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  dnsNames:
    {{- toYaml $serviceNames | nindent 4 }}
  issuerRef:
    name: {{ $fullname }}
    kind: Issuer
{{- end }}
{{- if $webhookManaged }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-webhook
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  secretName: {{ $fullname }}-webhook-tls
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  dnsNames:
    {{- toYaml $serviceNames | nindent 4 }}
  issuerRef:
    name: {{ $fullname }}
    kind: Issuer
{{- end }}
{{- if and .Values.proxy.enabled (not .Values.proxy.existingSecret) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $fullname }}-proxy
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  secretName: {{ $fullname }}-proxy-tls
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  dnsNames:
    - api.github.com
    - uploads.github.com
    - github.com
  issuerRef:
    name: {{ required "proxy.ca.name is required when cert-manager makes the proxy certificate" .Values.proxy.ca.name }}
    kind: {{ .Values.proxy.ca.kind }}
    group: {{ .Values.proxy.ca.group }}
{{- end }}
{{- end }}
{{- if .Values.certificate.caConfigMap.create }}
---
# The token API's CA for clients, to mount at /var/run/secrets/githubgate/ca.crt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.certificate.caConfigMap.name }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
data:
  ca.crt: {{ required "certificate.caBundle is required when certificate.caConfigMap.create is true" .Values.certificate.caBundle | quote }}
{{- end }}
