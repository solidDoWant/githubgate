{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: githubuserauthorizations.githubgate.soliddowant.dev
spec:
  group: githubgate.soliddowant.dev
  names:
    categories:
    - githubgate
    kind: GitHubUserAuthorization
    listKind: GitHubUserAuthorizationList
    plural: githubuserauthorizations
    singular: githubuserauthorization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.login
      name: Login
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GitHubUserAuthorization is a GitHub App authorized as one GitHub user.
          Admin namespaces only.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GitHubUserAuthorizationSpec is the desired state of a GitHubUserAuthorization.
            properties:
              allowedNamespaces:
                description: AllowedNamespaces says who may reference this authorization
                  from a policy.
                properties:
                  names:
                    description: Names lists namespaces by name.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: Selector admits every namespace whose labels match.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              appRef:
                description: AppRef is the GitHubApp the user authorizes. The App
                  needs a client ID.
                properties:
                  name:
                    description: Name is the object's name.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace defaults to the referring object's own
                      namespace.
                    type: string
                required:
                - name
                type: object
              ceiling:
                description: Ceiling is the most any policy may call as this user.
                properties:
                  operations:
                    description: |-
                      Operations are exact GitHub REST operation ids. The webhook accepts
                      only operations whose path names no owner, repository, organization or
                      enterprise. An empty list allows nothing. At most 256.
                    items:
                      description: |-
                        OperationName is the exact id of a GitHub REST operation, such as
                        `users/create-ssh-signing-key-for-authenticated-user`. It has no glob.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[a-z0-9/-]+$
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                type: object
              login:
                description: |-
                  Login is the GitHub user who must authorize the App. A token of any
                  other user is discarded. It is compared case-insensitively.
                maxLength: 39
                minLength: 1
                pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
                type: string
            required:
            - appRef
            - login
            type: object
          status:
            description: GitHubUserAuthorizationStatus is the observed state of a
              GitHubUserAuthorization.
            properties:
              accessTokenExpiresAt:
                description: AccessTokenExpiresAt is when the stored access token
                  expires.
                format: date-time
                type: string
              authorization:
                description: Authorization is set only while a device flow is in progress.
                properties:
                  expiresAt:
                    description: ExpiresAt is when the user code stops working.
                    format: date-time
                    type: string
                  request:
                    description: Request is the value of the authorize annotation
                      this flow answers.
                    type: string
                  userCode:
                    description: UserCode is the code the user enters at the verification
                      URI.
                    type: string
                  verificationURI:
                    description: VerificationURI is where the user enters the code.
                    type: string
                required:
                - expiresAt
                - request
                - userCode
                - verificationURI
                type: object
              conditions:
                description: Conditions include `Ready` and `AuthorizationRequired`.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastAuthorizeRequest:
                description: |-
                  LastAuthorizeRequest is the last authorize annotation value that was
                  handled. A flow starts only for a different value.
                type: string
              lastRefreshTime:
                description: LastRefreshTime is when the tokens were last refreshed.
                format: date-time
                type: string
              login:
                description: Login is the login the stored token belongs to.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                type: integer
              refreshRequestedAt:
                description: |-
                  RefreshRequestedAt is when a replica last saw GitHub refuse the
                  stored access token. The leader refreshes at once when it is later
                  than LastRefreshTime.
                format: date-time
                type: string
              refreshTokenExpiresAt:
                description: RefreshTokenExpiresAt is when the stored refresh token
                  expires.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name: at most 242 characters, so the token Secret''s
            name fits'
          rule: size(self.metadata.name) <= 242
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
