apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "githubgate.fullname" . }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "githubgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "githubgate.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      serviceAccountName: {{ include "githubgate.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: githubgate
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag | default .Chart.AppVersion }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --admin-namespaces={{ include "githubgate.adminNamespaces" . }}
            - --tls-cert-file=/var/run/githubgate/tls/tls.crt
            - --tls-key-file=/var/run/githubgate/tls/tls.key
            - --leader-elect
            {{- if .Values.githubBaseURL }}
            - --github-base-url={{ .Values.githubBaseURL }}
            {{- end }}
            {{- if .Values.webhook.enabled }}
            - --webhook
            - --webhook-cert-dir=/var/run/githubgate/webhook
            - --webhook-port=9444
            {{- end }}
            {{- if .Values.proxy.enabled }}
            - --proxy
            - --proxy-tls-cert-file=/var/run/githubgate/proxy/tls.crt
            - --proxy-tls-key-file=/var/run/githubgate/proxy/tls.key
            {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8080
            {{- if .Values.webhook.enabled }}
            - name: webhook
              containerPort: 9444
            {{- end }}
            {{- if .Values.proxy.enabled }}
            - name: proxy
              containerPort: 9443
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          volumeMounts:
            - name: tls
              mountPath: /var/run/githubgate/tls
              readOnly: true
            {{- if .Values.webhook.enabled }}
            - name: webhook-tls
              mountPath: /var/run/githubgate/webhook
              readOnly: true
            {{- end }}
            {{- if .Values.proxy.enabled }}
            - name: proxy-tls
              mountPath: /var/run/githubgate/proxy
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: tls
          secret:
            secretName: {{ include "githubgate.fullname" . }}-tls
        {{- if .Values.webhook.enabled }}
        - name: webhook-tls
          secret:
            secretName: {{ include "githubgate.fullname" . }}-webhook-tls
        {{- end }}
        {{- if .Values.proxy.enabled }}
        - name: proxy-tls
          secret:
            secretName: {{ include "githubgate.fullname" . }}-proxy-tls
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
