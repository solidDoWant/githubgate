{{- if .Values.inject.enabled }}
{{- $fullname := include "githubgate.fullname" . }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ $fullname }}-inject
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ $fullname }}-webhook
webhooks:
  - name: inject.githubgate.soliddowant.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $fullname }}
        namespace: {{ .Release.Namespace }}
        port: 9443
        path: /inject-pod
    namespaceSelector:
      matchExpressions:
        - key: githubgate.soliddowant.dev/inject
          operator: In
          values: ["true"]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ .Release.Namespace | quote }}]
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  - name: inject-pod.githubgate.soliddowant.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    reinvocationPolicy: IfNeeded
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ $fullname }}
        namespace: {{ .Release.Namespace }}
        port: 9443
        path: /inject-pod
    # Pods opted in by their own label, in namespaces that aren't opted in,
    # so no pod is sent twice. KubeVirt copies a VMI's labels to its
    # virt-launcher pod, so this also opts in VM workspaces.
    namespaceSelector:
      matchExpressions:
        - key: githubgate.soliddowant.dev/inject
          operator: NotIn
          values: ["true"]
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [{{ .Release.Namespace | quote }}]
    objectSelector:
      matchLabels:
        githubgate.soliddowant.dev/inject: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
{{- end }}
