apiVersion: v1
kind: Service
metadata:
  name: {{ include "githubgate.fullname" . }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "githubgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: https
    - name: metrics
      port: 8080
      targetPort: health
