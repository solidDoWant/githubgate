apiVersion: v1
kind: Service
metadata:
  name: {{ include "githubgate.fullname" . }}
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "githubgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 8443
      targetPort: https
    - name: metrics
      port: 8080
      targetPort: health
    {{- if .Values.webhook.enabled }}
    - name: webhook
      port: 9443
      targetPort: webhook
    {{- end }}
{{- if .Values.proxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "githubgate.fullname" . }}-proxy
  labels:
    {{- include "githubgate.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  {{- with .Values.proxy.clusterIP }}
  clusterIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "githubgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: proxy
      port: 443
      targetPort: proxy
{{- end }}
