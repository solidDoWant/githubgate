# -- Number of server replicas. Every replica serves requests.
replicas: 3
image:
  # -- Server image repository.
  repository: ghcr.io/soliddowant/githubgate
  # -- Image digest (`sha256:...`). When set, the image is pinned by digest and the tag is ignored. Set it in production.
  digest: ""
  # -- Image tag. Defaults to the chart's appVersion. Used only when no digest is set.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# -- Names of image pull Secrets.
imagePullSecrets: []
# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""
# -- Namespaces that may hold GitHubApp and GitHubInstallation objects, and whose Secrets githubgate may read. Defaults to the release namespace.
adminNamespaces: []
# -- GitHub REST API root. Empty means api.github.com. Set it for GitHub Enterprise Server or a test double.
githubBaseURL: ""
certManager:
  # -- Make the certificates with cert-manager: a self-signed Issuer, a name-constrained CA `Certificate` (Secret `<fullname>-ca`), and the serving certificates. Set to false to give every certificate as an existing Secret instead.
  enabled: true
tls:
  # -- Name of an existing Secret (`tls.crt`, `tls.key`) with the token API's serving certificate. Required when `certManager.enabled` is false.
  existingSecret: ""
webhook:
  # -- Serve the validating admission webhook.
  enabled: false
  # -- What the API server does when the webhook is unreachable.
  failurePolicy: Fail
  # -- Name of an existing Secret (`tls.crt`, `tls.key`) with the webhook server's certificate. Required when `certManager.enabled` is false and a webhook is on.
  existingSecret: ""
  # -- CA that signs the webhook server's certificate, as base64 PEM, for the webhooks' `caBundle`. Rendered only when set. Leave it empty when cainjector fills `caBundle`.
  caBundle: ""
  # -- Annotations on the validating and mutating webhook configurations, for example `cert-manager.io/inject-ca-from`.
  annotations: {}
inject:
  # -- Serve the mutating admission webhook that adds the interceptor sidecar to pods in labelled namespaces. Needs `proxy.enabled` or `inject.proxyCAConfigMap`.
  enabled: false
  image:
    # -- Client image repository. The injected sidecar runs it.
    repository: ghcr.io/soliddowant/githubgate-client
    # -- Client image digest (`sha256:...`). Required when `inject.enabled` is true.
    digest: ""
  # -- Address pods use for the proxy. Empty means `githubgate-proxy.<release namespace>.svc:443`.
  proxyAddress: ""
  # -- Name of a ConfigMap in the release namespace whose `ca.crt` holds the CA that signs the proxy certificate. Empty means the `ca.crt` of the proxy certificate's Secret.
  proxyCAConfigMap: ""
  # -- Name of a ConfigMap in the release namespace whose `ca.crt` holds extra CA certificates for the injected pods. Empty means none.
  extraCAConfigMap: ""
proxy:
  # -- Serve proxy mode: a second TLS listener behind the `githubgate-proxy` Service (port 443). Needs `proxy.ca` or `proxy.existingSecret`.
  enabled: false
  # -- Name of an existing Secret (`tls.crt`, `tls.key`, `ca.crt`) with the proxy certificate. Required when `certManager.enabled` is false and `proxy.enabled` is true.
  existingSecret: ""
  # -- Fixed cluster IP of the `githubgate-proxy` Service, so pods can name it in `hostAliases`. Empty means the cluster picks one.
  clusterIP: ""
  ca:
    # -- Name of the cert-manager Issuer or ClusterIssuer that signs the proxy certificate. Use the admin's name-constrained CA (permitted subtree `github.com`). Required when cert-manager makes the proxy certificate.
    name: ""
    # -- Kind of the issuer.
    kind: Issuer
    # -- API group of the issuer.
    group: cert-manager.io
  upstreams:
    # -- Where proxied `api.github.com` requests go. Empty means `https://api.github.com`.
    api: ""
    # -- Where proxied `uploads.github.com` requests go. Empty means `https://uploads.github.com`.
    uploads: ""
    # -- Where proxied `github.com` git requests go. Empty means `https://github.com`.
    git: ""
    # -- Name of a ConfigMap in the release namespace whose `ca.crt` holds extra CA certificates the upstreams may use. Empty means only the system CAs.
    caConfigMap: ""
certificate:
  caConfigMap:
    # -- Create a ConfigMap that publishes the token API's CA for clients, filled from `certificate.caBundle`.
    create: false
    # -- Name of that ConfigMap.
    name: githubgate-ca
  # -- The token API's CA certificate, as PEM. Required when `certificate.caConfigMap.create` is true.
  caBundle: ""
  # -- Validity of the CA that cert-manager makes.
  caDuration: 87600h
  # -- Validity of the serving certificates.
  duration: 2160h
  # -- How long before expiry cert-manager renews the serving certificates.
  renewBefore: 720h
podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: true
  # -- Pods that may be down at once.
  maxUnavailable: 1
# -- Seconds githubgate has to shut down.
terminationGracePeriodSeconds: 30
serviceMonitor:
  # -- Create a Prometheus Operator ServiceMonitor.
  enabled: false
  # -- Scrape interval.
  interval: 30s
crds:
  # -- Install the CRDs with the chart. Set to false when you manage them yourself.
  install: true
serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Defaults to the full name.
  name: ""
  # -- Annotations for the ServiceAccount.
  annotations: {}
resources:
  requests:
    # -- CPU request. There is no CPU limit.
    cpu: 100m
    # -- Memory request.
    memory: 128Mi
  limits:
    # -- Memory limit. Keep it equal to the memory request.
    memory: 128Mi
podSecurityContext:
  # -- Run the pod as a non-root user.
  runAsNonRoot: true
  # -- User ID of the pod (the distroless nonroot user).
  runAsUser: 65532
  # -- Group ID of the pod.
  runAsGroup: 65532
  seccompProfile:
    # -- Seccomp profile of the pod.
    type: RuntimeDefault
securityContext:
  # -- Allow privilege escalation in the container.
  allowPrivilegeEscalation: false
  # -- Mount the container's root filesystem read-only.
  readOnlyRootFilesystem: true
  capabilities:
    # -- Linux capabilities dropped from the container.
    drop: ["ALL"]
# -- Pod annotations.
podAnnotations: {}
# -- Node selector.
# -- Extra `/etc/hosts` entries for the server pods (pod `hostAliases`).
hostAliases: []
nodeSelector: {}
# -- Tolerations.
tolerations: []
# -- Affinity rules.
affinity: {}
